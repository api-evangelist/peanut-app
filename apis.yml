aid: peanut-app
name: Peanut App
description: Peanut is a social networking app connecting women through all stages of womanhood — from
  fertility and pregnancy to motherhood and menopause. Founded in 2017 by Michelle Kennedy, the platform
  provides a safe, moderated space where more than five million women find friends, join life-stage communities
  and groups, ask questions, and access expert content. Peanut is a consumer mobile-first product (iOS
  and Android) and does not publish a public developer API; this profile was surfaced as a portfolio company
  of partech and enriched with the artifacts the company genuinely publishes (llms.txt and domain-security
  posture).
